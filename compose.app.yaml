name: opencourse

# Application only (migrate, api, worker, web) for people who already run Postgres, Redis and an
# S3-compatible storage. Connection settings come from an env file, see `.env.external.example`:
#   docker compose --env-file .env.external -f compose.app.yaml up -d --build --wait
# Service definitions are reused from compose.yaml, so the two never drift apart.
services:
  migrate:
    extends:
      file: compose.yaml
      service: migrate
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to your Postgres}
    depends_on: !reset {}

  api:
    extends:
      file: compose.yaml
      service: api
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to your Postgres}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL to your Redis}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT to your storage}
    depends_on: !override
      migrate:
        condition: service_completed_successfully

  worker:
    extends:
      file: compose.yaml
      service: worker
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL to your Postgres}
      REDIS_URL: ${REDIS_URL:?set REDIS_URL to your Redis}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT to your storage}
    depends_on: !override
      migrate:
        condition: service_completed_successfully

  web:
    extends:
      file: compose.yaml
      service: web
