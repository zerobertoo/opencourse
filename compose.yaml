name: opencourse

# Local and self-hosted stack. Every default below is for development only:
# override the credentials through a `.env` file (see `.env.example`) before exposing it.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opencourse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opencourse}
      POSTGRES_DB: ${POSTGRES_DB:-opencourse}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage. The API only speaks generic S3, so this can be swapped.
  storage:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-opencourse}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-opencourse-secret}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ':9000'
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '${S3_PORT:-9000}:9000'
      - '${S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - storage-data:/data

  # one-shot job: creates the bucket once the storage answers
  storage-init:
    image: amazon/aws-cli:2.17.0
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-opencourse}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-opencourse-secret}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-opencourse}
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        until aws --endpoint-url http://storage:9000 s3api list-buckets >/dev/null 2>&1; do
          echo "waiting for storage..."; sleep 2
        done
        aws --endpoint-url http://storage:9000 s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null \
          || aws --endpoint-url http://storage:9000 s3api create-bucket --bucket "$$S3_BUCKET"
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

  # one-shot job: applies pending migrations before the API starts
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'dist/migrate.js']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-opencourse}:${POSTGRES_PASSWORD:-opencourse}@postgres:5432/${POSTGRES_DB:-opencourse}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-opencourse}:${POSTGRES_PASSWORD:-opencourse}@postgres:5432/${POSTGRES_DB:-opencourse}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:5173}
      # no default on purpose: the API refuses to start without a private secret (see .env.example)
      AUTH_SECRET: ${AUTH_SECRET:-}
      # cookies are Secure by default in production; plain-HTTP localhost needs this off
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # automated tests only: never enable this on a real deployment
      RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-false}
      WEBHOOKS_ALLOW_PRIVATE_NETWORKS: ${WEBHOOKS_ALLOW_PRIVATE_NETWORKS:-false}
      # object storage: the API and worker reach it inside the network, browsers by the public address
      S3_ENDPOINT: http://storage:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-opencourse}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-opencourse}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-opencourse-secret}
      VIDEO_MAX_UPLOAD_BYTES: ${VIDEO_MAX_UPLOAD_BYTES:-2147483648}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    ports:
      - '${API_PORT:-3000}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
      # `up --wait` treats a one-shot that nothing waits on as a failure when it exits
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports:
      - '${WEB_PORT:-5173}:80'
    depends_on:
      - api

  # long-running background worker: delivers outbox events and runs queue jobs (certificates, e-mail, video encoding)
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ['node', 'dist/worker.js']
    # lets a webhook point at a receiver on the host (needs WEBHOOKS_ALLOW_PRIVATE_NETWORKS=true)
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-opencourse}:${POSTGRES_PASSWORD:-opencourse}@postgres:5432/${POSTGRES_DB:-opencourse}
      REDIS_URL: redis://redis:6379
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:5173}
      # the shared config requires it, although the worker never signs anything
      AUTH_SECRET: ${AUTH_SECRET:-}
      WEBHOOKS_ALLOW_PRIVATE_NETWORKS: ${WEBHOOKS_ALLOW_PRIVATE_NETWORKS:-false}
      # object storage: the API and worker reach it inside the network, browsers by the public address
      S3_ENDPOINT: http://storage:9000
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000}
      S3_BUCKET: ${S3_BUCKET:-opencourse}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-opencourse}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-opencourse-secret}
      VIDEO_MAX_UPLOAD_BYTES: ${VIDEO_MAX_UPLOAD_BYTES:-2147483648}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  storage-data:
