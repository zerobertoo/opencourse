name: Demo (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - apps/docs/**
      - packages/shared/**
      - docs/**
      - pnpm-lock.yaml
      - package.json
      - pnpm-workspace.yaml
      - tsconfig.base.json
      - .npmrc
      - .nvmrc
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # no VITE_API_URL: the web app runs on the in-browser mock services
      - run: pnpm --filter @opencourse/web build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      # Pages has no SPA fallback, 404.html serves index.html on deep links
      - run: cp apps/web/dist/index.html apps/web/dist/404.html
      # the documentation site is served under /docs/ of the same Pages site
      # a docs failure must not stop the demo from being published (ci.yml already builds the docs)
      - id: docs
        continue-on-error: true
        run: pnpm --filter @opencourse/docs docs:build
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/docs/
          DOCS_SITE: https://${{ github.repository_owner }}.github.io
      - if: steps.docs.outcome == 'success'
        run: cp -r apps/docs/dist apps/web/dist/docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
