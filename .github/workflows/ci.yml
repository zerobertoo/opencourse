name: CI

on:
  pull_request:
  push:
    branches: [main]

# only PRs cancel superseded runs
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  static:
    name: Static checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # the pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check

      # both setups must keep rendering; the app-only file reuses services from compose.yaml
      - run: docker compose config -q && docker compose --env-file .env.external.example -f compose.app.yaml config -q

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      # the docs site is not part of `pnpm build`, so check it here and keep it from blocking the demo deploy
      - run: pnpm --filter @opencourse/docs docs:build

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # real services for the API integration tests (same defaults as compose.yaml)
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: opencourse
          POSTGRES_PASSWORD: opencourse
          POSTGRES_DB: opencourse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opencourse -d opencourse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # S3-compatible storage for the video tests: the API's defaults point at it (localhost:9000)
      storage:
        image: rustfs/rustfs:1.0.1
        env:
          RUSTFS_ACCESS_KEY: opencourse
          RUSTFS_SECRET_KEY: opencourse-secret
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: ':9000'
        ports:
          - 9000:9000
    env:
      DATABASE_URL: postgres://opencourse:opencourse@localhost:5432/opencourse
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7

      # the pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # the video tests encode a small clip
      # a pinned static build instead of apt: the Ubuntu mirror once took over 14 minutes to
      # download the 87 packages ffmpeg pulls in
      - name: Install ffmpeg
        timeout-minutes: 5
        env:
          FFMPEG_TAG: autobuild-2026-10-22-13-06
          FFMPEG_ARCHIVE: ffmpeg-n8.1.3-23-g5c4f5744cd-linux64-gpl-8.1
          FFMPEG_SHA256: 1aa0c5526768bf4db3e62cba954169e3e0be38327c9cbbb6c5675794df6c03df
        run: |
          curl -fsSL --retry 3 -o ffmpeg.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_TAG}/${FFMPEG_ARCHIVE}.tar.xz"
          echo "${FFMPEG_SHA256}  ffmpeg.tar.xz" | sha256sum -c -
          sudo tar -xJf ffmpeg.tar.xz --strip-components=2 -C /usr/local/bin "${FFMPEG_ARCHIVE}/bin/ffmpeg" "${FFMPEG_ARCHIVE}/bin/ffprobe"
          rm ffmpeg.tar.xz
          ffmpeg -version | head -1

      - name: Create the storage bucket
        env:
          AWS_ACCESS_KEY_ID: opencourse
          AWS_SECRET_ACCESS_KEY: opencourse-secret
          AWS_DEFAULT_REGION: us-east-1
        run: |
          # the storage container has no health check, so wait until it answers
          for attempt in $(seq 1 30); do
            aws --endpoint-url http://localhost:9000 s3api list-buckets >/dev/null 2>&1 && break
            sleep 2
          done
          aws --endpoint-url http://localhost:9000 s3api create-bucket --bucket opencourse

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # keeps the required check name
  verify:
    name: Lint, typecheck, test and build
    needs: [static, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ needs.static.result }} ${{ needs.test.result }}
        run: |
          echo "static and test: ${RESULTS}"
          [ "${RESULTS}" = "success success" ]

  e2e:
    name: End-to-end (Docker Compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # only main writes the layer cache
      - uses: docker/setup-buildx-action@v4
      - name: Build the images
        uses: docker/bake-action@v7
        with:
          files: compose.yaml
          load: true
          set: |
            *.cache-from=type=gha,scope=compose
            ${{ github.event_name == 'push' && '*.cache-to=type=gha,mode=max,scope=compose' || '' }}

      - name: Start the stack
        run: |
          # the API refuses to start without a private secret, so each run makes its own
          export AUTH_SECRET="$(openssl rand -base64 48)"
          # the tests sign up many accounts from one IP, which the production limits would block
          export RATE_LIMIT_DISABLED=true
          docker compose --profile dev up -d --wait
      - run: pnpm --filter @opencourse/api test:e2e
      - name: Show service logs on failure
        if: failure()
        run: docker compose --profile dev logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose --profile dev down -v

  docker:
    name: Docker image build
    # PRD section 13: the image build only runs on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # build only: publishing images is out of scope for now
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=compose
