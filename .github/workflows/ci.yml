name: CI

on:
  pull_request:
  push:
    branches: [main]

# a newer push to the same ref makes the older run pointless
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # real services for the API integration tests (same defaults as compose.yaml)
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: opencourse
          POSTGRES_PASSWORD: opencourse
          POSTGRES_DB: opencourse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opencourse -d opencourse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://opencourse:opencourse@localhost:5432/opencourse
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7

      # the pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End-to-end (Docker Compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the stack
        run: |
          # the API refuses to start without a private secret, so each run makes its own
          export AUTH_SECRET="$(openssl rand -base64 48)"
          # the tests sign up many accounts from one IP, which the production limits would block
          export RATE_LIMIT_DISABLED=true
          docker compose up -d --build --wait
      - run: pnpm --filter @opencourse/api test:e2e
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  docker:
    name: Docker image build
    # PRD section 13: the image build only runs on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # build only: publishing images is out of scope for now
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
